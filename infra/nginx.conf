# /etc/nginx/sites-available/blackbox
# infra/setup-vps.sh fills in the domains (blackbox.example, api.blackbox.example) and Certbot adds TLS.

# Website (Next.js on 127.0.0.1:3000)
server {
  listen 80;
  listen [::]:80;
  server_name blackbox.example;

  add_header Strict-Transport-Security "max-age=31536000" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Live feed of the demo console (Server-Sent Events)
  location /mock-api/v1/feed/live {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API (Fastify on 127.0.0.1:4000)
server {
  listen 80;
  listen [::]:80;
  server_name api.blackbox.example;

  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 2m;

  # Live feed (Server-Sent Events)
  location /v1/feed/live {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API trusts this header only from loopback (Fastify trustProxy), so rate limits see real visitors.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
