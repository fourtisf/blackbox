[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Conservative target for an Arbitrum Orbit chain; confirm against Robinhood Chain docs before testnet deploy.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [
  { access = "read", path = "../protocol/vectors.json" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 1000

[fmt]
line_length = 110
